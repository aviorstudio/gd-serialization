name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
          if [ "$plugin_version" != "$version" ]; then
            echo "addon/plugin.cfg version is $plugin_version, but the next $BUMP release is $version." >&2
            echo "Update addon/plugin.cfg to version=\"$version\", commit it, then rerun this workflow." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The same checks CI runs, from the same definition. This workflow used
      # to package and publish without running any of them -- the only thing
      # between a broken commit and the GDAM registry was whether somebody had
      # looked at CI. Running them here against this exact commit is the point:
      # CI passing on this SHA earlier is a claim about that run.
      - name: Test
        uses: ./.github/actions/test

      - name: Verify tested package identity
        id: package
        run: |
          set -euo pipefail
          bash scripts/verify-package.sh dist/@aviorstudio_gd-serialization.zip
          echo "sha256=$(sha256sum dist/@aviorstudio_gd-serialization.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Install GDAM
        uses: aviorstudio/gdam-actions/install@699727af05ff8da8f6816cc5c14a16b2b9470219 # v0.2.0
        with:
          version: v0.0.8
          archive-sha256: 7ef2a325ad1416ce850a332f4380b1b290bd7a56e2a20f544536386cf64abb92

      - name: Verify GDAM CLI identity
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'bf5d03baa94da905ca128a55c4acd6b0552c60127d53fc4d01ecaa8a377b0b53' "$RUNNER_TEMP/gdam-bin/gdam" | sha256sum --check
          test "$(gdam --version | head -n 1)" = 'gdam 0.0.8'

      - name: Publish verified addon release
        uses: aviorstudio/gdam-actions/release@699727af05ff8da8f6816cc5c14a16b2b9470219 # v0.2.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
          asset: dist/@aviorstudio_gd-serialization.zip
          tested-sha256: ${{ steps.package.outputs.sha256 }}
